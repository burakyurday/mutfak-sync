[package]
name = "mutfak-sync"
version = "0.1.8"
edition = "2021"
rust-version = "1.88"
description = "Mutfak Ajans güvenli bulut yedekleme"
license = "MIT"

[lib]
name = "mutfak_sync"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mutfak-sync"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-autostart", "dep:tauri-plugin-opener", "dep:tauri-plugin-process", "dep:tauri-plugin-updater", "dep:keyring", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
notify = "8"
walkdir = "2"
md-5 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
trash = "5"
fs2 = "0.4"
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri = { version = "2", optional = true, features = ["tray-icon"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-process = { version = "2.3.1", optional = true }
tauri-plugin-updater = { version = "2.9.0", optional = true }

[dev-dependencies]
tempfile = "3"
