name: Create desktop release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v*-preview.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version matching package.json and tauri.conf.json
        required: true
        default: 0.1.1
      confirm_unsigned:
        description: I understand these installers are unsigned test builds
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  verify-input:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify version, updater signing material and explicit unsigned confirmation
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          CONFIRM_UNSIGNED: ${{ inputs.confirm_unsigned }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY || secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            test "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME"
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
            RELEASE_VERSION="${RELEASE_VERSION%%-preview.*}"
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            test "$CONFIRM_UNSIGNED" = "true"
            RELEASE_VERSION="$INPUT_VERSION"
            RELEASE_TAG="v${RELEASE_VERSION}-preview.${GITHUB_RUN_NUMBER}"
          fi
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "$RELEASE_VERSION"
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::GitHub Secret TAURI_SIGNING_PRIVATE_KEY eksik veya boş"
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::GitHub Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD eksik veya boş"
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PUBLIC_KEY" ]; then
            echo "::error::GitHub Variable TAURI_SIGNING_PUBLIC_KEY eksik veya boş"
            exit 1
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  package:
    needs: verify-input
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run sidecar -- ${{ matrix.target }}
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build signed updater artifacts and unsigned OS installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY || secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          set -o pipefail
          TAURI_CONFIG=$(node -e "process.stdout.write(JSON.stringify({plugins:{updater:{endpoints:['https://github.com/burakyurday/mutfak-sync/releases/latest/download/latest.json'],pubkey:process.env.TAURI_SIGNING_PUBLIC_KEY,requireSignedVersion:true}}}))")
          export TAURI_CONFIG
          if ! npm run tauri build -- --features desktop --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci 2>&1 | tee tauri-build.log; then
            DIAGNOSTIC=$(grep -Ei 'error|failed|invalid|key|password|signature|updater' tauri-build.log | tail -n 8 | tr '\n' ' ')
            echo "::error title=Tauri signed build failed::${DIAGNOSTIC:-Ayrıntılı build logunu açın}"
            exit 1
          fi
      - name: Package macOS files
        if: runner.os == 'macOS'
        env:
          RELEASE_VERSION: ${{ needs.verify-input.outputs.version }}
        run: |
          mkdir -p release
          ditto -c -k --keepParent "src-tauri/target/${{ matrix.target }}/release/bundle" "release/mutfak-sync-${RELEASE_VERSION}-macos-arm64-unsigned.zip"
          shasum -a 256 release/*.zip > "release/mutfak-sync-${RELEASE_VERSION}-macos-arm64-unsigned.sha256"
          UPDATER_ARCHIVE=$(find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f -name '*.app.tar.gz' -print -quit)
          test -n "$UPDATER_ARCHIVE"
          test -f "${UPDATER_ARCHIVE}.sig"
          cp "$UPDATER_ARCHIVE" "release/mutfak-sync-${RELEASE_VERSION}-darwin-aarch64.app.tar.gz"
          cp "${UPDATER_ARCHIVE}.sig" "release/mutfak-sync-${RELEASE_VERSION}-darwin-aarch64.app.tar.gz.sig"
      - name: Package Windows files
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.verify-input.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path "src-tauri/target/${{ matrix.target }}/release/bundle/*" -DestinationPath "release/mutfak-sync-$env:RELEASE_VERSION-windows-x64-unsigned.zip"
          $hash = (Get-FileHash "release/mutfak-sync-$env:RELEASE_VERSION-windows-x64-unsigned.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  mutfak-sync-$env:RELEASE_VERSION-windows-x64-unsigned.zip" | Set-Content "release/mutfak-sync-$env:RELEASE_VERSION-windows-x64-unsigned.sha256"
          $installer = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle" -Recurse -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Updater installer bulunamadı" }
          if (-not (Test-Path "$($installer.FullName).sig")) { throw "Updater imzası bulunamadı" }
          Copy-Item $installer.FullName "release/mutfak-sync-$env:RELEASE_VERSION-windows-x86_64-setup.exe"
          Copy-Item "$($installer.FullName).sig" "release/mutfak-sync-$env:RELEASE_VERSION-windows-x86_64-setup.exe.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    needs: [verify-input, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Create signed updater manifest
        env:
          RELEASE_VERSION: ${{ needs.verify-input.outputs.version }}
          RELEASE_TAG: ${{ needs.verify-input.outputs.tag }}
          RELEASE_PUBLISHED_AT: ${{ github.event.repository.updated_at }}
        run: node scripts/create-update-manifest.mjs release "$RELEASE_VERSION" "$RELEASE_TAG" "${{ github.repository }}"
      - name: Create desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify-input.outputs.version }}
          RELEASE_TAG: ${{ needs.verify-input.outputs.tag }}
        run: |
          RELEASE_FLAGS=()
          RELEASE_KIND="Kararlı sürüm"
          if [[ "$RELEASE_TAG" == *-preview.* ]]; then
            RELEASE_FLAGS+=(--prerelease)
            RELEASE_KIND="Deneme sürümü"
          fi
          gh release create "$RELEASE_TAG" release/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            "${RELEASE_FLAGS[@]}" \
            --title "Mutfak Sync v${RELEASE_VERSION} — ${RELEASE_KIND}" \
            --notes "Uygulama içi güncelleme paketleri Mutfak Sync yayın anahtarıyla imzalanmıştır. macOS ve Windows işletim sistemi kod imzası henüz yoktur; güvenlik kontrollerini devre dışı bırakmayın. Deneme sürümleri otomatik güncelleme kanalına gönderilmez."
