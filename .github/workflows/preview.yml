name: UI preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview.yml'
permissions:
  contents: write
concurrency:
  group: mutfak-sync-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture actual browser preview
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          npm run test:e2e
      - name: Publish tested screenshots
        run: |
          mkdir -p docs/assets
          cp artifacts/dashboard.png docs/assets/dashboard-light.png
          cp artifacts/dashboard-dark.png docs/assets/dashboard-dark.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text()
          start = "<!-- preview:start -->"
          end = "<!-- preview:end -->"
          if start in s and end in s:
              section = '''
          <picture>
            <source media="(prefers-color-scheme: dark)" srcset="docs/assets/dashboard-dark.png">
            <source media="(prefers-color-scheme: light)" srcset="docs/assets/dashboard-light.png">
            <img src="docs/assets/dashboard-light.png" alt="Mutfak Sync browser dashboard preview" width="100%">
          </picture>

          <sub>Actual React browser preview, captured by Playwright. This is not a native desktop screenshot or a live Drive connection.</sub>
          '''
              left, rest = s.split(start, 1)
              _, right = rest.split(end, 1)
              p.write_text(left + start + "\n" + section.strip() + "\n" + end + right)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/dashboard-light.png docs/assets/dashboard-dark.png README.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: publish tested browser UI screenshots [skip ci]'
            git push origin HEAD:main
          fi
